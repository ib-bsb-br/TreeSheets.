name: RK3588 Bullseye .deb

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build-rk3588-bullseye-arm64:
    name: Build RK3588-tuned Debian 11 arm64 package
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxext-dev \
            lld \
            ninja-build \
            pkg-config

      - name: configure rk3588 preset
        run: |
          cmake -S . -B _build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGING_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxBUILD_SHARED=OFF \
            -DwxBUILD_INSTALL=OFF \
            -DwxUSE_SYS_LIBS=OFF \
            -DTREE_SHEETS_RK3588_OPT=ON \
            -DTREE_SHEETS_LIGHT_PROFILING=OFF \
            -DTREESHEETS_VERSION=${{ github.run_number }}

      - name: build and package
        run: cmake --build _build --target package -j"$(nproc)"

      - name: normalize deb name
        run: |
          shopt -s extglob
          for file in _build/treesheets_*:*.deb; do mv -v "${file}" "${file/_+([[:digit:]]):/_}"; done

      - name: upload rk3588 bullseye package
        uses: actions/upload-artifact@v4
        with:
          name: treesheets-rk3588-bullseye-arm64-deb
          path: _build/treesheets_*.deb
