name: RK3588 Bullseye .deb

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build-rk3588-bullseye-arm64:
    name: Build RK3588-tuned Debian 11 arm64 package
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxext-dev \
            lld \
            ninja-build \
            pkg-config

      - name: configure rk3588 preset
        shell: bash
        run: |
          cmake --preset rk3588-bullseye-release \
            -DTREESHEETS_VERSION=${{ github.run_number }}

      - name: build and package
        shell: bash
        run: cmake --build --preset package-rk3588-bullseye-release -j"$(nproc)"

      - name: normalize deb name
        shell: bash
        run: |
          shopt -s nullglob
          shopt -s extglob
          files=( _build/treesheets_*:*.deb )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No epoch-prefixed .deb filenames found; skipping rename."
            exit 0
          fi
          for file in "${files[@]}"; do
            mv -v "${file}" "${file/_+([[:digit:]]):/_}"
          done

      - name: upload rk3588 bullseye package
        uses: actions/upload-artifact@v4
        with:
          name: treesheets-rk3588-bullseye-arm64-deb
          path: _build/treesheets_*.deb
